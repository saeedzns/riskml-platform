[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "risk-ml-platform"
version = "0.1.0"
description = "Production-oriented credit risk ML platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Saeed" }]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "mlflow>=2.16,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "shap>=0.46,<1",
  "sqlalchemy>=2.0,<2.1",
  "ucimlrepo>=0.0.7,<1",
  "uvicorn[standard]>=0.30,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pip-audit>=2.10,<3",
  "pre-commit>=3.8,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]
airflow = ["apache-airflow>=3.3.2,<4"]

[project.scripts]
risk-ml = "risk_ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["risk_ml"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "pandas.*", "shap", "sklearn.*", "ucimlrepo"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = ["integration: requires external services", "slow: intentionally slower test"]

[tool.coverage.run]
source = ["risk_ml"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

