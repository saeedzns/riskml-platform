name: Deploy API to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ vars.AZURE_LOCATION }}
          template: infra/main.bicep
          parameters: >-
            environmentName=prod location=${{ vars.AZURE_LOCATION }}
            postgresAdminLogin=${{ vars.POSTGRES_ADMIN_LOGIN }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      - run: >-
          az containerapp update --name "${{ vars.CONTAINER_APP_NAME }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --image "${{ vars.ACR_LOGIN_SERVER }}/risk-ml-api:${{ inputs.image_tag }}"

