name: Deploy API to Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to deploy
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ vars.AZURE_LOCATION }}
          template: infra/main.bicep
          parameters: >-
            environmentName=prod location=${{ vars.AZURE_LOCATION }}
            postgresAdminLogin=${{ vars.POSTGRES_ADMIN_LOGIN }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      - run: docker compose up -d postgres mlflow
      - run: docker compose build cli
      - run: docker compose run --rm cli python -m alembic upgrade head
      - run: >-
          docker compose run --rm cli risk-ml download-uci
          --output data/processed/uci_credit.csv
      - run: >-
          docker compose run --rm cli risk-ml ingest
          --input data/processed/uci_credit.csv
          --source uci-statlog-german-credit-144
      - run: docker compose run --rm cli risk-ml transform
      - run: >-
          docker compose run --rm cli risk-ml train
          --model xgboost --source uci-statlog-german-credit-144
      - name: Upload immutable champion artifact
        run: >-
          az storage file upload
          --account-name "${{ steps.infrastructure.outputs.storageAccountName }}"
          --share-name models --source artifacts/champion.joblib
          --path champion.joblib --auth-mode login --overwrite
      - run: >-
          az containerapp update --name "${{ vars.CONTAINER_APP_NAME }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --image "${{ vars.ACR_LOGIN_SERVER }}/risk-ml-api:${{ inputs.image_tag }}"

