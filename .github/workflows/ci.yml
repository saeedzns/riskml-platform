name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -m "not integration" --cov --cov-report=xml

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_USER: risk_ml
          POSTGRES_PASSWORD: risk_ml_ci
          POSTGRES_DB: risk_ml
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U risk_ml -d risk_ml"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RISK_ML_DATABASE_URL: postgresql+psycopg://risk_ml:risk_ml_ci@localhost:5432/risk_ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest -m integration
      - run: python -m alembic downgrade base && python -m alembic upgrade head

  containers-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -f docker/api.Dockerfile -t risk-ml-api:ci .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit --local --skip-editable

  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,airflow]"
      - run: python -m pytest tests/unit/test_dag.py

